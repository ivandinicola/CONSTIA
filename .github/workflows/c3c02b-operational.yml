# Trusted L5 candidate pinned to the audited H5/D5. H's workflow at the same path is never used as launcher code.
name: C3-C trusted isolation launcher
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: constia-c3c02b-operational
  cancel-in-progress: false
env:
  CODE_SHA: 2a97f1919e15d10ec887b87108b62b336e3bfbe3
  CONSTIA_B3_APPROVED_SHA: 2a97f1919e15d10ec887b87108b62b336e3bfbe3
  CONSTIA_B3_APPROVED_ACTOR_ID: '147414572'
  CONSTIA_B3_INVENTORY_SHA256: 688e7dd742efde53bc14667f5b8feda1ba8222cd19ea113c482e58217af0ccdb
  CONSTIA_B3_APPROVED_PHASE: isolation-only
  C3C02B_PHASE: isolation-only
  # Suppress hooks, fsmonitor and checkout EOL transforms on this disposable runner only.
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: core.hooksPath
  GIT_CONFIG_VALUE_0: /dev/null
  GIT_CONFIG_KEY_1: core.fsmonitor
  GIT_CONFIG_VALUE_1: 'false'
  GIT_CONFIG_KEY_2: core.autocrlf
  GIT_CONFIG_VALUE_2: 'false'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only identity gate
        shell: python3 -I -B {0}
        env:
          LAUNCHER_STAGE: gate
          LAUNCHER_READ_TOKEN: ${{ github.token }}
        run: &trusted_verifier |
          # BEGIN TRUSTED PYTHON
          import hashlib, io, json, os, pathlib, re, subprocess, urllib.request, stat, sys, tempfile, ipaddress

          H = "64ebe684ed882dae04ad4068b40c8fae4b5d26b2"
          PARENT = "62543ba874eb4d080ca68913d72dac944417ad7f"
          PARENT_TREE = "7e1b5989d29e07f53aa2c12e70dd04b5d0e8d4b5"
          HISTORICAL_PARENT = "5eb98f07728bfa8602930af04a286a21a78b6cf9"
          HISTORICAL_TREE = "4bfc2c9331295db1ab395b46434b108817d1b37c"
          R16_BLOB = "50066c24e376596ba3e0701cacb5d38047491bd0"
          CHANGED = (".github/scripts/test_c3c02b_runner.py",)
          HISTORICAL_CHANGED = (".github/scripts/c3c02b_runner.py", ".github/scripts/test_c3c02b_runner.py")
          SDK_IMAGE = "mcr.microsoft.com/dotnet/sdk@sha256:8dd1a57fe6b7b8b1b357635db67e272c2f9e9d76d1dd0a32711c4c33c57d7b43"
          BASE = "79923e86eb1ce450db40d538d55848eaebe7877c"
          TREE = "e8118bd886ca2cb20895c0285ed7e707c9a0d6fe"
          D = "00fd956a40a6e803e9ee37cff6d19bf46cb4c5a01b45c59d8f32ae1f420a3c83"
          REPO = "ivandinicola/CONSTIA"
          REF = REPO + "/.github/workflows/c3c02b-operational.yml@refs/heads/main"
          ACTOR = "147414572"
          TABLE = {
              ".github/scripts/c3c02b_runner.py": "a278e398a93646bba0f3dc867912c6375bbf42ac51b954a329fe4dc2153e8635",
              ".github/scripts/test_c3c02b_runner.py": "2025b1e8c0ce8e97333586d658b887b7ed87e8f0331ea2609d6df826f9e1bad1",
              ".github/workflows/c3c02b-operational.yml": "64474d003db5210f29c8b5bd5dbcc975b03297a083375410090ef02761986695",
              "docs/operations/c3-c-02b.md": "c7d615eee315cb2239b3f754b82946eb7b1b8696ff18aef87f4d954a865ed992",
