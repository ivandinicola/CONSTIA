name: TEMP-004 Migration Generation

on:
  push:
    branches:
      - feature/TEMP-004

permissions:
  contents: read

jobs:
  generate-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.12
          echo "$RUNNER_TEMP/dotnet-tools" >> "$GITHUB_PATH"

      - name: Save baseline model snapshot
        run: cp src/Constia.Infrastructure/Migrations/ConstiaDbContextModelSnapshot.cs "$RUNNER_TEMP/ConstiaDbContextModelSnapshot.before.cs"

      - name: Generate and validate migration
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1;Initial Catalog=ConstiaDesignOnly;User ID=ef-fake;Password=Fake-only-not-a-credential-2026!;TrustServerCertificate=True;Connect Timeout=1"
          JwtSettings__SigningKey: "CONSTIA_DESIGN_ONLY_FAKE_SIGNING_KEY_2026_NOT_A_SECRET"
          JwtSettings__Issuer: "constia-design-only"
          JwtSettings__Audience: "constia-design-only"
          JwtSettings__ExpirationMinutes: "5"
        run: |
          set -euo pipefail
          dotnet ef migrations add AddHabitoConcurrencyVersion \
            --project src/Constia.Infrastructure/Constia.Infrastructure.csproj \
            --startup-project src/Constia.API/Constia.API.csproj \
            --configuration Release \
            --no-build \
            --output-dir Migrations

          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import os
          import re
          import shutil
          import sys

          migrations_dir = Path("src/Constia.Infrastructure/Migrations")
          migration_files = list(migrations_dir.glob("*_AddHabitoConcurrencyVersion.cs"))
          designer_files = list(migrations_dir.glob("*_AddHabitoConcurrencyVersion.Designer.cs"))
          generated_files = sorted(
              [path.relative_to(Path.cwd()).as_posix() for path in migration_files + designer_files]
              + (["src/Constia.Infrastructure/Migrations/ConstiaDbContextModelSnapshot.cs"]
                 if (migrations_dir / "ConstiaDbContextModelSnapshot.cs").exists() else [])
          )

          def reject(message, up_operations=None, down_operations=None):
              print(f"Migration validation failed: {message}", file=sys.stderr)
              print("Generated migration files:", file=sys.stderr)
              for generated_file in generated_files:
                  print(f"  {generated_file}", file=sys.stderr)
              if up_operations is not None:
                  print(f"Up() operations detected: {up_operations!r}", file=sys.stderr)
              if down_operations is not None:
                  print(f"Down() operations detected: {down_operations!r}", file=sys.stderr)
              raise SystemExit(1)

          if len(migration_files) != 1 or len(designer_files) != 1:
              reject("expected exactly one migration and one Designer file.")

          migration_file = migration_files[0]
          source = migration_file.read_text(encoding="utf-8")

          def method_body(method_name):
              match = re.search(rf"\b{method_name}\s*\([^)]*\)\s*\{{", source)
              if not match:
                  reject(f"could not locate {method_name}() in {migration_file.name}.")
              opening = source.find("{", match.start())
              depth = 0
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:index]
              reject(f"could not parse {method_name}() in {migration_file.name}.")

          up = method_body("Up")
          down = method_body("Down")
          # EF emits generic calls such as AddColumn<long>(...), so allow a generic
          # argument list between the operation name and its opening parenthesis.
          operation_pattern = r"migrationBuilder\.(\w+)(?:\s*<[^<>]+>)?\s*\("
          up_operations = re.findall(operation_pattern, up)
          down_operations = re.findall(operation_pattern, down)
          if up_operations != ["AddColumn"]:
              reject("Up() must contain only AddColumn for Habito.ConcurrencyVersion.", up_operations, down_operations)
          if down_operations != ["DropColumn"]:
              reject("Down() must contain only DropColumn for Habito.ConcurrencyVersion.", up_operations, down_operations)
          required_up_fragments = [
              'name: "ConcurrencyVersion"',
              'table: "Habito"',
              'type: "bigint"',
              "nullable: false",
          ]
          if not all(fragment in up for fragment in required_up_fragments):
              reject("AddColumn does not match the expected required bigint Habito.ConcurrencyVersion column.", up_operations, down_operations)
          default_match = re.search(r"\bdefaultValue:\s*(-?\d+)L", up)
          if not default_match:
              reject("EF scaffold did not include the expected numeric temporary backfill value.", up_operations, down_operations)
          scaffold_default = default_match.group(1)
          if 'name: "ConcurrencyVersion"' not in down or 'table: "Habito"' not in down:
              reject("Down() does not remove Habito.ConcurrencyVersion.", up_operations, down_operations)
          if "defaultValueSql:" in source or "Sql(" in source:
              reject("Unexpected SQL default or raw SQL in generated migration.", up_operations, down_operations)

          before = (Path(os.environ["RUNNER_TEMP"]) / "ConstiaDbContextModelSnapshot.before.cs").read_text(encoding="utf-8")
          after = (migrations_dir / "ConstiaDbContextModelSnapshot.cs").read_text(encoding="utf-8")
          property_pattern = re.compile(
              r'(?m)^[ \t]*b\.Property<long>\("ConcurrencyVersion"\)\r?\n'
              r'(?:[ \t]*\.[^\r\n]+\r?\n)+'
          )
          if len(property_pattern.findall(after)) != 1:
              reject("snapshot must contain exactly one ConcurrencyVersion property.", up_operations, down_operations)
          snapshot_without_token = property_pattern.sub("", after).replace("\r\n", "\n")
          baseline_snapshot = before.replace("\r\n", "\n")
          if snapshot_without_token != baseline_snapshot:
              print("Snapshot differences after removing ConcurrencyVersion:", file=sys.stderr)
              difference = difflib.unified_diff(
                  baseline_snapshot.splitlines(),
                  snapshot_without_token.splitlines(),
                  fromfile="baseline snapshot",
                  tofile="generated snapshot without expected property",
                  lineterm="",
              )
              for line_number, line in enumerate(difference):
                  if line_number == 80:
                      print("  ... additional snapshot differences omitted ...", file=sys.stderr)
                      break
                  print(line, file=sys.stderr)
              reject("snapshot contains model changes beyond ConcurrencyVersion.", up_operations, down_operations)

          artifact_root = Path(os.environ["RUNNER_TEMP"]) / "temp-004-migration-artifact"
          artifact_migrations = artifact_root / "src/Constia.Infrastructure/Migrations"
          artifact_migrations.mkdir(parents=True, exist_ok=True)
          for path in (migration_file, designer_files[0], migrations_dir / "ConstiaDbContextModelSnapshot.cs"):
              shutil.copy2(path, artifact_migrations / path.name)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as output:
              output.write("### TEMP-004 migration generation\n")
              output.write("- Generated one migration, its designer, and the updated model snapshot.\n")
              output.write(f"- EF scaffolding emitted temporary `defaultValue: {scaffold_default}L`; this is not the approved backfill. Before applying, change the migration to backfill existing habits with `1` and remove any permanent SQL default.\n")
              output.write("- No database service, User Secrets, real credentials, or database update command was used.\n")
          print("Migration scope validated; manual backfill/default review is required before application.")
          PY

      - name: Upload migration files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: temp-004-add-habit-concurrency-version
          path: ${{ runner.temp }}/temp-004-migration-artifact/
          if-no-files-found: error
          retention-days: 7
